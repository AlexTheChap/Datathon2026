[project]
name = "alphaforge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "strands-agents",
    "bedrock-agentcore[strands-agents]>=0.4",   # orchestrator entrypoint (node ⑤)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",                    # AF_* settings
    "pandas",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "requests"]   # requests: scripts (nbim_exclusions…) exercised by tests/unit
# Data-collection scripts in scripts/ (network access to SEC, iShares, NBIM, etc.)
scripts = ["requests", "beautifulsoup4", "lxml", "openpyxl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The backend `app` package (agents, tools, schemas) is installed editable so
# tests and the AgentCore entrypoint import `app.*` from anywhere.
[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
