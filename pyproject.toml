[project]
name = "alphaforge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "strands-agents",
    "bedrock-agentcore[strands-agents]>=0.4",   # orchestrator entrypoint (node ⑤)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",                    # AF_* settings
    "pandas>=3,<4",                              # pandas 4 drops the fastparquet engine (see below)
    "numpy",
    "pyyaml",
    "fastparquet>=2024.2",                       # Parquet engine of tools/curated_store.py (kept over pyarrow: Lambda zip size)
    "cvxpy",                                     # constrained optimizer (tools/optimizer.py)
]

[project.optional-dependencies]
# requests: scripts (nbim_exclusions…) exercised by tests/unit · httpx: FastAPI TestClient (tests/unit/test_api.py)
dev = ["pytest", "ruff", "requests", "httpx"]
# Data-collection scripts in scripts/ (network access to SEC, iShares, NBIM, etc.)
scripts = ["requests", "beautifulsoup4", "lxml", "openpyxl"]
# Market refresh (app.market.refresh): Yahoo Finance daily bars for the S&P 500 graph (bundled in the Lambda zip)
market = ["yfinance>=1.0"]
# Intake agent (box 3) on Bedrock: Claude Haiku with structured outputs via the anthropic SDK (AnthropicBedrock).
# truststore: on Windows, lets botocore see the system certificates (otherwise CERTIFICATE_VERIFY_FAILED).
bedrock = ["anthropic>=2.0", "truststore>=0.9"]
# API (box 2): FastAPI app, run on Lambda behind API Gateway through the Mangum adapter (architecture.mmd L1).
api = ["fastapi>=0.110", "mangum>=0.17", "pyjwt[crypto]>=2.8",   # pyjwt: verifies Cognito ID tokens (api/auth.py)
       "python-multipart>=0.0.9", "pypdf>=4,<6"]                 # profile from a document: upload + PDF text (.docx needs nothing)
# Browser tests of the frontend (tests/e2e/test_frontend_ui.py, skipped without it);
# then run: python -m playwright install chromium
ui = ["playwright>=1.45", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The backend `app` package (agents, tools, schemas, context) is installed editable so
# the AgentCore entrypoint and scripts import `app.*` from anywhere.
[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]   # tests also work without `pip install -e .`
testpaths = ["tests"]      # unit + e2e (all offline: no AWS account, no LLM call)
