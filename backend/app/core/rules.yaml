# Fitfolio governance rules, VERSION 1 (to be validated by the team)
# Every threshold is a documented, adjustable ASSUMPTION. They are not regulatory standards.
# Conceptual references: BNCD workshop "Understanding the investor" (objective, horizon,
# willingness ≠ capacity, constraints ≠ preferences, diversification = exposures).
version: 1
updated: 2026-11-14
currency: CAD


risk_bands:                    # based on the declared risk profile AND capacity (the more cautious wins)
  low:
    max_single_position: 0.10
    max_sector: 0.30
    max_crypto: 0.00
  low_moderate:
    max_single_position: 0.10
    max_sector: 0.35
    max_crypto: 0.00
  moderate:
    max_single_position: 0.10
    max_sector: 0.40
    max_crypto: 0.02
  high:
    max_single_position: 0.15
    max_sector: 0.50
    max_crypto: 0.10

horizon_rules:
  # "horizon" = LOWER bound of the declared horizon (nearest need), for prudence.
  - id: SHORT_HORIZON_VOLATILITY
    when: {horizon_years_max_lt: 5}
    max_weight_high_vol_assets: 0.05     # assets whose annualized volatility > high_vol_threshold
    high_vol_threshold: 0.40
    severity: BLOCK
    justification: "Less than 5 years to absorb a decline before a major withdrawal."
  - id: SHORT_HORIZON_DEFENSIVE
    when: {horizon_years_max_lt: 5}
    min_defensive_weight: 0.30           # etf_bond + cash
    severity: WARN
    justification: "A short horizon calls for a share of low-volatility assets; indicative threshold."

broad_funds_exempt_from_single_position:  # a broad ETF is not a "single position" for the cap
  - XIU.TO
  - SPY
  - ESGV
  - QQQ
  - XBB.TO
  - ZST.TO
  - AGG
  - TLT

controversy_indirect:          # controversial company (verified rows) held VIA decomposed ETFs
  max_weight: 0.01             # above 1% of the portfolio, flag it
  severity: WARN               # WARN, not BLOCK: the user picks a fund, not the stock (assumption)

esg_activity:                  # activity-based exclusions (profile: {"type": "esg_activity", "value": "<activity>"})
  min_revenue_share: 0.10      # excluded if ≥ 10% of revenue (indicative threshold, assumption; overridable per profile)
  indirect:                    # excluded company held VIA decomposed ETFs
    max_weight: 0.01
    severity: WARN

esg_index_screen:              # ESG preference (not a constraint): signal from curated/esg_index_screen.csv
  applies_if_preference: "ESG" # active if a profile preference contains this word (Mateo: "important ESG factors")
  severity: WARN               # preference ≠ constraint: never BLOCK
  reference_by_currency:       # reference ESG index for a directly held stock
    USD: ESGV                  # FTSE US All Cap Choice
    CAD: XCSR.TO               # MSCI Canada IMI Extended ESG Leaders (also keeps the best ratings: broader signal)
  reference_by_parent:         # to describe the share of broad ETFs missing from the ESG index (information only)
    SPY: ESGV
    XIU.TO: XCSR.TO

severities:
  max_single_position: WARN
  max_sector: WARN
  max_crypto: BLOCK
  exclusions: BLOCK

justifications:
  max_single_position: "Common diversification practice: limit dependence on a single company."
  max_sector: "Diversifying means varying exposures: a dominant sector makes the portfolio depend on a single driver."
  max_crypto: "Extreme volatility (maximum loss of about -73% for BTC over the period); excluded for low-risk profiles."
  exclusions: "Explicit user preferences (ESG, asset classes): constraints set the limits."
  esg_index_screen: "Declared ESG preference: flags positions that a recognized ESG index left out. The index composition does not say why; this is a signal to discuss, not a prohibition."

# Fit score (fit_score.py): how well a portfolio fits THIS profile, out of 100. Deterministic, no LLM.
# Every point lost names its reason, the measured value and the target. Thresholds are team ASSUMPTIONS.
fit_score:
  version: 1
  points:                      # 100 in all
    rules: 30                  # every governance check above (pass, warning, unverified, block)
    risk_level: 20             # annualised volatility vs the range of the risk band
    asset_mix: 20              # share of growth assets (stocks, equity funds, crypto) vs the range of the risk band
    loss: 15                   # worst historical drop vs the loss the person accepts
    horizon: 5                 # time spent below the previous high after that drop vs the horizon
    diversification: 10        # effective number of companies in the stock part (ETFs looked through)
  rules:
    kept_share: {PASS: 1.0, WARN: 0.4, UNVERIFIED: 0.5, BLOCK: 0.0}   # share of a check's points kept
    near_limit_from: 0.8       # a PASS above 80% of its limit starts losing points...
    near_limit_max_loss: 0.3   # ...up to 30% of that check's points at the limit itself
    block_caps_total_at: 49    # a portfolio that breaks a rule can never read as a fit
  risk_level:                  # annualised volatility range per risk band (CAD, 5 years of daily returns). Set from the
    low: [0.03, 0.075]         # data: the Canadian bond index alone ~6.6%, a 70/30 stock/bond mix ~11%, US stocks ~16%.
    low_moderate: [0.06, 0.095]
    moderate: [0.08, 0.13]
    high: [0.11, 0.20]
    zero_at_distance: 0.5      # all points lost when outside the range by half its width (too bold OR too cautious)
  asset_mix:                   # growth-asset share per risk band (usual balanced-portfolio practice; indicative)
    low: [0.0, 0.30]
    low_moderate: [0.20, 0.50]
    moderate: [0.40, 0.70]
    high: [0.60, 1.00]
    zero_at_distance: 0.30     # all points lost 30 percentage points outside the range
  loss:
    typical_by_band: {low: 0.10, low_moderate: 0.15, moderate: 0.25, high: 0.40}  # if the profile gives no loss_capacity
    zero_at_ratio: 2.0         # all points lost when the worst drop is twice the accepted loss...
    stated_double_caps_total_at: 49   # ...and, if the person STATED that loss, the total is capped like a broken rule
  horizon:
    full_until_share: 0.5      # full points while recovering took at most half the (shortest) horizon...
    zero_at_share: 1.0         # ...none when it took the whole horizon or more (or never recovered within it)
  diversification:
    full_from: 30              # effective companies in the stock part: 30 or more = full points
    zero_at: 3                 # 3 or fewer = none (log scale in between)
