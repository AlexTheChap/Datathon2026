# Règles de gouvernance AlphaForge — VERSION 1 (à valider par l'équipe)
# Chaque seuil est une HYPOTHÈSE documentée, ajustable. Ce ne sont pas des normes réglementaires.
# Repères conceptuels : atelier BNCD « Comprendre l'investisseur » (objectif, horizon,
# volonté ≠ capacité, contraintes ≠ préférences, diversification = expositions).
version: 1
updated: 2026-11-14
currency: CAD

stress_window: "2022"          # scénario de référence pour la perte maximale (voir risk_tools.STRESS_WINDOWS)

risk_bands:                    # selon le profil de risque déclaré ET la capacité (la plus prudente l'emporte)
  faible:
    max_drawdown_stress: 0.10
    max_single_position: 0.10
    max_sector: 0.30
    max_crypto: 0.00
  faible_a_modere:
    max_drawdown_stress: 0.15
    max_single_position: 0.10
    max_sector: 0.35
    max_crypto: 0.00
  modere:
    max_drawdown_stress: 0.25
    max_single_position: 0.10
    max_sector: 0.40
    max_crypto: 0.02
  eleve:
    max_drawdown_stress: 0.40
    max_single_position: 0.15
    max_sector: 0.50
    max_crypto: 0.10

horizon_rules:
  # « horizon » = borne BASSE de l'horizon déclaré (besoin le plus proche), par prudence.
  - id: HORIZON_COURT_VOLATILITE
    when: {horizon_years_max_lt: 5}
    max_weight_high_vol_assets: 0.05     # actifs dont la volatilité annualisée > high_vol_threshold
    high_vol_threshold: 0.40
    severity: BLOCK
    justification: "Moins de 5 ans pour absorber une baisse avant un retrait important (atelier : horizon court < 3 ans, moyen 3-10 ans)."
  - id: HORIZON_COURT_DEFENSIF
    when: {horizon_years_max_lt: 5}
    min_defensive_weight: 0.30           # etf_bond + liquidités
    severity: WARN
    justification: "Un horizon court justifie une part d'actifs peu volatils ; seuil indicatif."

broad_funds_exempt_from_single_position:  # un FNB large n'est pas une « position unique » au sens du plafond
  - XIU.TO
  - SPY
  - ESGV
  - QQQ
  - XBB.TO
  - ZST.TO
  - AGG
  - TLT

controversy_indirect:          # société controversée (lignes vérifiées) détenue VIA des FNB décomposés
  max_weight: 0.01             # au-delà de 1 % du portefeuille, on signale
  severity: WARN               # WARN et non BLOCK : l'usager choisit un fonds, pas le titre (hypothèse)

esg_activity:                  # exclusions par activité (profil : {"type": "esg_activity", "value": "<activite>"})
  min_revenue_share: 0.10      # exclue si ≥ 10 % des revenus (seuil indicatif, hypothèse ; surchargeable par profil)
  indirect:                    # société exclue détenue VIA des FNB décomposés
    max_weight: 0.01
    severity: WARN

esg_index_screen:              # préférence ESG (pas une contrainte) : signal tiré de curated/esg_index_screen.csv
  applies_if_preference: "ESG" # actif si une préférence du profil contient ce mot (Mateo : « facteurs ESG importants »)
  severity: WARN               # préférence ≠ contrainte : jamais BLOCK
  reference_by_currency:       # indice ESG de référence pour une action détenue en direct
    USD: ESGV                  # FTSE US All Cap Choice
    CAD: XCSR.TO               # MSCI Canada IMI Extended ESG Leaders (retient aussi les meilleures notes : signal plus large)
  reference_by_parent:         # pour décrire la part des FNB larges absente de l'indice ESG (information seulement)
    SPY: ESGV
    XIU.TO: XCSR.TO

severities:
  max_drawdown_stress: BLOCK
  max_single_position: WARN
  max_sector: WARN
  max_crypto: BLOCK
  exclusions: BLOCK

justifications:
  max_drawdown_stress: "Perte simulée sur 2022 (actions et obligations en baisse ensemble) comparée à la perte tolérée par le profil. Mesure la capacité, pas seulement la volonté."
  max_single_position: "Pratique courante de diversification : limiter la dépendance à une seule entreprise (atelier : risque de concentration)."
  max_sector: "Diversifier, c'est varier les expositions : un secteur dominant fait dépendre le portefeuille d'un même moteur."
  max_crypto: "Volatilité extrême (perte maximale ~-73 % pour BTC sur la période) ; exclue pour les profils faibles."
  exclusions: "Préférences explicites de l'usager (ESG, catégories d'actifs) : les contraintes établissent les limites."
  esg_index_screen: "Préférence ESG déclarée (énoncé) : on signale les positions qu'un indice ESG reconnu a écartées. La composition ne dit pas pourquoi ; c'est un signal à discuter, pas une interdiction."
