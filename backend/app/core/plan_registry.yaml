# Task → sub-agent registry of the Plan resolver (④, link L4 of docs/architecture.mmd).
# Read by backend/app/context/plan_resolver.py. Deterministic: same inputs → same plan.
# Every change bumps `version` (copied into ExecutionPlan.registry_version).
version: 2
updated: 2026-11-15

# Below this threshold, ExecutionPlan.needs_clarification = true (the run still happens).
min_intake_confidence: 0.6


# Agents REQUIRED by each task: always enabled, even if profile.agent_toggles disables them
# (the plan then marks them forced = true).
tasks:
  risk_review:         {required: [risk]}
  scenario_analysis:   {required: [macro_scenarios, risk]}
  allocation_proposal: {required: [allocation, risk]}
  esg_screen:          {required: [esg]}
  fundamentals_review: {required: [fundamentals]}
  news_review:         {required: [news]}
  projection:          {required: [risk]}      # risk sub-agent: projection + vol_forecast tools
  out_of_scope:        {required: []}          # no sub-agent; the Explainer politely declines

# Agents added from the Request or the Profile, whatever the task (except out_of_scope).
# `trigger` = name of a predicate in plan_resolver.TRIGGERS.
# forced: false → a profile toggle set to false wins (warning in the plan).
# forced: true  → the toggle is ignored: a profile constraint must be checked.
triggers:
  - {agent: news,            trigger: rag_requested,          forced: false}
  - {agent: esg,             trigger: esg_preference,         forced: false}
  - {agent: esg,             trigger: esg_exclusion,          forced: true}
