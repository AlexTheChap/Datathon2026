<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlphaForge, investment questions explained</title>
  <meta name="description" content="Ask a question about your portfolio and see what AlphaForge will analyse, and why. Simulation only, not investment advice.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    /* Apply the saved mode before first paint, so the page never flashes the wrong one. */
    try { const m = localStorage.getItem("af.mode"); if (m === "light" || m === "dark") document.documentElement.dataset.mode = m; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="assets/app.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="wordmark" href="#/ask" aria-label="AlphaForge, home">AlphaForge</a>
      <nav class="nav" aria-label="Main">
        <a class="nav__link" href="#/ask" data-route="ask">Ask</a>
        <a class="nav__link" href="#/profile" data-route="profile">Profile</a>
      </nav>
      <div class="topbar__tools">
        <span class="who" id="who"></span>
        <button class="icon-btn" type="button" id="mode-toggle" aria-label="Switch to dark mode">
          <svg id="mode-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <noscript>
      <div class="page-head">
        <h1>AlphaForge needs JavaScript</h1>
        <p>This app talks to the AlphaForge API from your browser. Turn JavaScript on and reload the page.</p>
      </div>
    </noscript>
  </main>

  <div class="visually-hidden" role="status" aria-live="polite" id="live"></div>

  <footer class="footer">
    <div class="container">Simulation only. Nothing here is investment advice, and no real trade is ever placed.</div>
  </footer>
</body>
</html>
